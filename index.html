<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Time</title>

</head>
<body style = "background-color: aquamarine;">

    <padding style="padding: 200px;"></padding>
    <h2 style="color: rgb(67, 102, 255); text-align: center; font-size: 50px;">UTC time:</h2>

    <h1 id="time" style="color: rgb(67, 102, 255); text-align: center; font-size: 90px;">Loading...</h1>

    <script>

        async function getLocalTime() {
            Intl.DateTimeFormat().resolvedOptions().timeZone;
            try {
                const response = await fetch("/time");
                if (!response.ok) {
                    throw new Error(`Time request failed: ${response.status}`);
                }

                const data = await response.json();
                if (typeof data.date_time !== "string") {
                    throw new Error("The time service returned an invalid response");
                }

                document.getElementById("time").innerText =
                    data.date_time.substring(11, 19);

            } catch (error) {
                console.error("Error fetching time:", error);
                document.getElementById("time").innerText = "ERROR";
            }
        }

        getLocalTime();
        setInterval(getLocalTime, 1000);

    </script>

</body>
</html>
