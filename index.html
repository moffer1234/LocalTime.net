<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Time</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1 id="time" style="color: rgb(67, 102, 255);">Loading...</h1>

    <script>

        async function getLocalTime() {
            try {
                let apiUrl = "/time";

                apiUrl = "https://verbose-bassoon-r457rjjxg69qhpq45.github.dev:8000/time";
                
                const response = await fetch(apiUrl);

                const data = await response.json();

                document.getElementById("time").innerText =
                    data.date_time.substring(11, 19);

            } catch (error) {
                console.error("Error fetching time:", error);
                document.getElementById("time").innerText = "ERROR";
            }
        }

        getLocalTime();
        setInterval(getLocalTime, 1000);

    </script>

</body>
</html>
