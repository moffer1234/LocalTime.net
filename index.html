<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Time</title>
</head>
<body>

    <h1 id="time" style="color: rgb(67, 102, 255);">Loading...</h1>

    <script>

        async function getLocalTime() {
            try {

 
                let apiUrl = "/time";

                if (window.location.hostname.endsWith("github.io")) {
                    apiUrl = "https://verbose-bassoon-r457rjjxg69qhpq45.github.dev:8000/time";
                }

                const response = await fetch(apiUrl);

                console.log("Status:", response.status);

                if (!response.ok) {
                    throw new Error(`HTTP error: ${response.status}`);
                }

                const data = await response.json();

                console.log("Data:", data);

                document.getElementById("time").innerText =
                    data.date_time.substring(11, 19);

            } catch (error) {

                console.error("Error:", error);

                document.getElementById("time").innerText = "ERROR";
            }
        }

        getLocalTime();
        setInterval(getLocalTime, 1000);

    </script>

</body>
</html>
